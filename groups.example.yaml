# 按群的知识库，键是群号。拷成 data/astrbot/groups.yaml 再改（容器里是 /AstrBot/data/groups.yaml）。
# data/ 不进仓库，群号、QQ 号、外号都只写在那份里。改了不用重启，插件下次用到时会重新读。
# 群知识库插件每天凌晨读前一天的聊天，往 members、notes、events 里加东西，只加不删；手写的照样保留。
# 杀炫区在用：notes 交给判定的模型，members 用来认打字里提到的外号是谁。events 只是留档。

"123456789":
  name: 主群  # 只给人看，插件不用
  notes:  # 这个群的黑话、规矩，一条一句
    - 「绿帽」指群管理员（QQ 里管理员是绿色标识）
    - 「炫蛆」「杀批」「这不杀啊」是在喊杀炫区动手
  members:  # QQ 号: 群名片以外，大家怎么叫他（群名片插件自己知道，不用写）
    "10001": [老王, 王哥]
  events:  # 每天值得留档的事，按日期
    "2026-01-01":
      - 09:30 老王晒了新键盘，群友围攻半小时
